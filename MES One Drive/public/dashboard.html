<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Files · iDCAS File Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">▣</span><span>iDCAS File Portal</span></div>
            <div class="nav-label">Workspace</div>
            <a class="nav-item active" href="dashboard.html"><span class="nav-icon">▤</span>All files</a>
            <a class="nav-item" href="settings.html"><span class="nav-icon">⚙</span>Settings</a>
            <div class="logout-menu"><button class="logout-btn" onclick="logout()"><span class="nav-icon">↪</span>Sign out</button></div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div class="page-title">Files</div>
                <div class="profile"><span class="avatar">A</span><span>Admin</span></div>
            </header>
            <section class="content">
                <div class="content-heading">
                    <div><h1>All files</h1><p>Upload, organize, and share files from your workspace.</p></div>
                </div>
                <div class="toolbar">
                    <div class="search-box"><input id="search" placeholder="Search files" aria-label="Search files" onkeyup="searchFiles()"></div>
                </div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon" aria-hidden="true">↑</div>
                    <div class="upload-copy"><h2>Upload files</h2><p>Choose files or drag and drop them here.</p></div>
                    <input type="file" id="fileInput" multiple aria-label="Choose files to upload">
                    <button class="primary-btn" onclick="uploadFile()">Upload</button>
                    <div id="progress" role="status"></div>
                </div>
                <h2 class="section-title">Files <span class="file-count">Your workspace files</span></h2>
                <div class="table-wrap">
                    <table class="file-table">
                        <thead><tr><th>Select</th><th>Type</th><th>Name</th><th>Size</th><th>Date modified</th><th>Actions</th></tr></thead>
                        <tbody id="fileList"></tbody>
                    </table>
                </div>
                <div class="table-footer"><button class="secondary-btn" onclick="downloadFiles()">↓ &nbsp;Download selected</button></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
